<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GasMain: Gaple</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#150d2e;--panel:#22164f;--ink:#f1edff;--mute:#9a8fd0;--cy:#5ef2e0;--pk:#ff4f8b;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
[hidden]{display:none!important}
body{background:radial-gradient(800px 420px at 85% -8%,#4a2bb066,transparent),radial-gradient(600px 400px at -10% 105%,#ff4f8b22,transparent),var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh}
.wrap{max-width:460px;margin:0 auto;padding:14px 14px 40px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.back{color:var(--mute);text-decoration:none;font-weight:700}
h1{font-size:38px;font-weight:800;letter-spacing:-1.5px;margin:0;line-height:1}
.sub{color:var(--mute);margin:6px 0 14px}
.btn{font:inherit;font-weight:700;border:0;border-radius:14px;padding:12px 14px;background:var(--panel);color:var(--ink);cursor:pointer}
.btn.sm{padding:7px 12px;font-size:12px;border-radius:99px}
.btn.off{opacity:.5}
.btn.main{background:var(--cy);color:#06241f;width:100%;font-size:17px;padding:15px}
.seg{display:flex;gap:6px}
.seg .btn{flex:1;padding:10px 6px;font-size:14px}
.seg .btn.on{background:var(--cy);color:#06241f}
.opps{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.op{flex:1;min-width:90px;background:var(--panel);border-radius:14px;padding:8px 10px;display:flex;align-items:center;gap:8px;font-size:13px;border:2px solid transparent}
.op.on{border-color:var(--pk)}
.op span{margin-left:auto;background:#ffffff1c;border-radius:99px;padding:2px 9px;font-weight:800}
.mejaw{--s:34px;--u:calc(var(--s)*2 + 8px);background:radial-gradient(120% 90% at 50% 0,#22906f,#124a3c 70%);border-radius:24px;border:3px solid #3a2590;padding:14px 8px 18px;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;box-shadow:inset 0 8px 20px #0005,0 6px 0 #24165f;overflow:hidden}
.ends{width:100%;display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:#fff;padding:0 6px}
.ends span{background:#0004;border-radius:99px;padding:3px 10px}
.chain{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.rw{display:flex;align-items:center;gap:4px;width:calc(var(--u)*5)}
.rw.rtl{flex-direction:row-reverse}
.rw.cr{gap:0}
.ar{display:flex;align-items:center;gap:4px}
.ar.al{width:calc(var(--u)*2);justify-content:flex-end}
.ar.ao{width:var(--u);justify-content:center}
.ar.arr{width:calc(var(--u)*2)}
.ph{margin:0;color:#ffffffbb;font-weight:700;text-align:center}
.dm{position:relative;display:flex;flex:none;background:linear-gradient(160deg,#fff,#e6dfff);border-radius:10px;box-shadow:0 3px 0 #0007,inset 0 0 0 1px #0002;border:0;padding:0;font:inherit}
.dm::after{content:"";position:absolute;background:#150d2e33}
.dm.h{flex-direction:row}.dm.h::after{left:calc(50% - 1px);top:14%;bottom:14%;width:2px}
.dm.v{flex-direction:column}.dm.v::after{top:calc(50% - 1px);left:14%;right:14%;height:2px}
.dm .hf{width:var(--s);height:var(--s);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:15%}
.dm.h .hf{transform:rotate(90deg)}
.dm .hf i{place-self:center;width:74%;aspect-ratio:1;border-radius:50%}
.dm .hf i.on{background:radial-gradient(circle at 35% 30%,#5b49a8,#150d2e 70%);box-shadow:0 1px 0 #fff9}
.dm.open{box-shadow:0 0 0 3px #5ef2e0,0 0 14px #5ef2e0,0 3px 0 #0007}
.hand{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:14px;padding-top:14px}
.hand .dm{--s:46px;cursor:pointer;opacity:.5;transition:transform .12s,opacity .12s}
.hand .dm.ok{opacity:1;transform:translateY(-8px);box-shadow:0 0 0 3px var(--cy),0 3px 0 #0007}
.status{padding:12px 14px;border-radius:14px;background:var(--panel);font-weight:700;margin:12px 0;min-height:52px;line-height:1.35}
.status.you{box-shadow:inset 0 0 0 2px var(--cy)}
.status.foe{box-shadow:inset 0 0 0 2px var(--pk)}
.ov{position:fixed;inset:0;background:#0b0620ee;display:none;place-items:center;padding:20px;z-index:9}
.ov.on{display:grid}
.card{background:var(--panel);border-radius:24px;padding:26px;text-align:center;max-width:340px;width:100%}
.card h2{font-size:32px;margin:0 0 8px;letter-spacing:-1px;line-height:1.05}
.card p{color:var(--mute);margin:0 0 18px;line-height:1.4}
.card .btn+.btn{margin-top:10px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px);background:var(--ink);color:#1a1040;font-weight:800;padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:92vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
[hidden]{display:none!important}
#md{margin-bottom:10px}
.mpbox{background:var(--panel);border-radius:16px;padding:12px;margin:10px 0 14px}
#mpc{display:flex;flex-direction:column;gap:8px}
#mpc:not([hidden])+.mpinfo:not(:empty){margin-top:10px}
.r{display:flex;gap:8px}
.r input{font:inherit;font-weight:700;flex:1;min-width:0;background:var(--bg);color:var(--ink);border:2px solid #ffffff22;border-radius:12px;padding:10px 12px;letter-spacing:3px;text-transform:lowercase}
.mpinfo{color:var(--mute);line-height:1.45;font-size:14px}
.mpinfo b{color:var(--cy);font-size:24px;letter-spacing:4px}
#mpstart{margin-top:10px}
</style>
<script src="/mp.js"></script>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="back" href="/">&lsaquo; GasMain</a><button class="btn sm" id="sfx"></button></div>
  <h1>Gaple</h1>
  <p class="sub">Habiskan kartu dominomu duluan. Tidak cocok, lewat!</p>
  <div class="seg" id="md"><button class="btn on" data-m="cpu">Lawan komputer</button><button class="btn" data-m="mp">Mabar online</button></div>
  <div id="mp" hidden><div class="mpbox"><div id="mpc"><button class="btn" id="mkroom">Buat room</button><div class="r"><input id="code" placeholder="Kode dari teman" maxlength="5" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn" id="joinroom">Gabung</button></div></div><div class="mpinfo" id="mpinfo"></div><button class="btn main" id="mpstart" hidden>Mulai main</button></div></div>
  <div class="seg" id="seg"><button class="btn on" data-n="1">1 lawan</button><button class="btn" data-n="3">3 lawan</button></div>
  <div class="opps" id="opps"></div>
  <div class="mejaw" id="table"><div class="ends" id="ends"></div><div class="chain" id="chain"></div></div>
  <div class="status you" id="st"></div>
  <div class="hand" id="hand"></div>
</div>
<div class="ov" id="side"><div class="card"><h2>Taruh di mana?</h2><p>Kartu ini cocok di kedua ujung.</p><button class="btn main" id="sideL"></button><button class="btn main" id="sideR"></button></div></div>
<div class="ov" id="ov"><div class="card"><h2 id="ovT"></h2><p id="ovS"></p><button class="btn main" id="ovB">Main lagi</button></div></div>
<div class="toast" id="tt" role="status"></div>
<script>
const ME=(()=>{let n="";try{n=(localStorage.getItem("gasmain_nama")||decodeURIComponent(location.hash.slice(1)).replace(/_/g," ")).trim().slice(0,14)}catch(e){}
  if(n){const s=document.createElement("span");s.textContent=n;s.style.cssText="font-weight:800;color:#5ef2e0;background:#ffffff14;padding:5px 12px;border-radius:99px;font-size:13px;max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap";
    const top=document.querySelector(".top"),tg=top.querySelector(".tg");
    if(tg)tg.insertBefore(s,tg.firstChild);else top.insertBefore(s,top.querySelector(".btn"))}
  return n||"Kamu"})();
const $=s=>document.querySelector(s);
let RNG=Math.random;const MPG={on:false,P:0,seat:0,names:[],first:0};let mode="cpu";
const PIP=[[],[4],[0,8],[0,4,8],[0,2,6,8],[0,2,4,6,8],[0,2,3,5,6,8]];
let n=1,P=2,hands,chain,cur,passes,over,busy,rid=0,names,must,msg="",pendI=null,ori=0;

/* suara */
let AC,sOn=true;
function sfx(k){
  if(!sOn)return;const K=window.AudioContext||window.webkitAudioContext;if(!K)return;
  AC=AC||new K();if(AC.state==="suspended")AC.resume();const t=AC.currentTime;
  const T=(f,s,d,ty="triangle",v=.25)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(.0001,t+s);g.gain.linearRampToValueAtTime(v,t+s+.01);g.gain.exponentialRampToValueAtTime(.0001,t+s+d);o.connect(g);g.connect(AC.destination);o.start(t+s);o.stop(t+s+d+.05)};
  ({tak:()=>{T(190,0,.07,"square",.2);T(140,.04,.09,"square",.15)},pass:()=>T(220,0,.22,"sine",.3),win:()=>[523,659,784,1047].forEach((f,i)=>T(f,i*.12,.4)),lose:()=>[392,330,262,196].forEach((f,i)=>T(f,i*.2,.5,"sawtooth",.15)),draw:()=>{T(330,0,.25);T(330,.25,.35)}})[k]();
}
const lab=()=>{$("#sfx").textContent="Efek "+(sOn?"nyala":"mati");$("#sfx").classList.toggle("off",!sOn)};
$("#sfx").onclick=()=>{sOn=!sOn;lab()};lab();
const say=(t,c)=>{$("#st").textContent=t;$("#st").className="status "+c};
let tto;const toast=t=>{const e=$("#tt");e.textContent=t;e.classList.add("on");clearTimeout(tto);tto=setTimeout(()=>e.classList.remove("on"),1800)};

/* kartu */
const sum=t=>t.x+t.y;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(RNG()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const half=v=>`<div class="hf">${[...Array(9).keys()].map(k=>`<i${PIP[v].includes(k)?' class="on"':""}></i>`).join("")}</div>`;
const dom=(a,b,o,extra="")=>`<${extra?"button":"div"} class="dm ${o}${extra&&extra.cls?" "+extra.cls:""}" ${extra?`data-i="${extra.i}"`:""}>${half(a)}${half(b)}</${extra?"button":"div"}>`;
const L=()=>chain[0].a,R=()=>chain[chain.length-1].b;
function sides(t){
  if(!chain.length)return(!must||(t.x===must.x&&t.y===must.y))?["R"]:[];
  const s=[];if(t.x===L()||t.y===L())s.push("L");if(t.x===R()||t.y===R())s.push("R");return s;
}

/* tampilan */
const tileH=(c,dir,cls)=>{const d=c.t===c.h,a=dir==="rtl"?c.h:c.t,b=dir==="rtl"?c.t:c.h;return dom(a,b,(d?"v":"h")+(cls?" "+cls:""))};
function render(){
  $("#opps").innerHTML=hands.slice(1).map((h,k)=>`<div class="op ${cur===k+1&&!over?"on":""}"><b>${names[k+1]}</b><span>${h.length}</span></div>`).join("");
  const tb=$("#table"),cw=tb.clientWidth||380;
  tb.style.setProperty("--s",Math.max(24,Math.min(40,Math.floor((cw-24)/11.4)))+"px");
  let h="";
  if(!chain.length)h='<p class="ph">Meja masih kosong. Taruh kartu pertama.</p>';
  else{
    const og=chain[ori],ogI={t:og.a,h:og.b};
    const rt=chain.slice(ori+1).map(c=>({t:c.a,h:c.b})),lf=chain.slice(0,ori).reverse().map(c=>({t:c.b,h:c.a}));
    const lo=lf.length?lf[lf.length-1]:ogI,ro=rt.length?rt[rt.length-1]:ogI;
    const T=(x,dir)=>tileH(x,dir,!over&&(x===lo||x===ro)?"open":"");
    const chunk=(a,k)=>{const o=[];for(let i=0;i<a.length;i+=k)o.push(a.slice(i,i+k));return o};
    const up=chunk(lf.slice(2),5),down=chunk(rt.slice(2),5);
    const row=(tiles,dir)=>`<div class="rw ${dir}">${tiles.map(x=>T(x,dir)).join("")}</div>`;
    for(let k=up.length-1;k>=0;k--)h+=row(up[k],k%2?"rtl":"ltr");
    h+=`<div class="rw cr"><div class="ar al">${lf.slice(0,2).reverse().map(x=>T(x,"rtl")).join("")}</div><div class="ar ao">${T(ogI,"ltr")}</div><div class="ar arr">${rt.slice(0,2).map(x=>T(x,"ltr")).join("")}</div></div>`;
    for(let k=0;k<down.length;k++)h+=row(down[k],k%2?"ltr":"rtl");
  }
  $("#chain").innerHTML=h;
  $("#ends").innerHTML=chain.length?`<span>Ujung kiri: ${L()}</span><span>Ujung kanan: ${R()}</span>`:`<span>&nbsp;</span>`;
  $("#hand").innerHTML=hands[0].map((t,i)=>dom(t.x,t.y,"v",{i,cls:cur===0&&!over&&!busy&&sides(t).length?"ok":""})).join("");
}

/* alur permainan */
function newGame(){
  rid++;if(MPG.on){P=MPG.P;names=[...Array(P)].map((_,i)=>MPG.names[(MPG.seat+i)%P])}else{P=n+1;names=[ME,...(n===1?["Komputer"]:[...Array(n)].map((_,i)=>"Bot "+(i+1)))]}
  const ts=[];for(let x=0;x<=6;x++)for(let y=x;y<=6;y++)ts.push({x,y});shuffle(ts);
  const gsO=i=>MPG.on?(MPG.seat+i)%P:i;
  hands=[...Array(P)].map((_,i)=>ts.slice(gsO(i)*7,gsO(i)*7+7).sort((a,b)=>sum(b)-sum(a)));
  let best=-1,st=0;[...Array(P).keys()].sort((a,b)=>gsO(a)-gsO(b)).forEach(i=>hands[i].forEach(t=>{const v=t.x===t.y?100+t.x:sum(t);if(v>best){best=v;st=i}}));
  cur=st;must=hands[st].filter(t=>t.x===t.y).sort((a,b)=>b.x-a.x)[0]||null;
  chain=[];passes=0;over=false;busy=false;pendI=null;msg="";
  $("#ov").classList.remove("on");$("#side").classList.remove("on");
  msg=`${names[st]} jalan duluan${must?` dengan balak ${must.x}-${must.y}`:""}.`;
  next();
}
function place(pi,i,side){
  if(MPG.on&&pi===0){const q=hands[0][i];mpSend({t:"act",k:"place",seat:MPG.seat,x:q.x,y:q.y,side})}
  const t=hands[pi].splice(i,1)[0];
  if(!chain.length){chain.push({a:t.x,b:t.y});ori=0}
  else if(side==="L"){chain.unshift(t.y===L()?{a:t.x,b:t.y}:{a:t.y,b:t.x});ori++}
  else chain.push(t.x===R()?{a:t.x,b:t.y}:{a:t.y,b:t.x});
  must=null;passes=0;sfx("tak");msg=`${names[pi]} menaruh ${t.x}-${t.y}.`;
  if(!hands[pi].length)return finish(pi,false);
  cur=(cur+1)%P;next();
}
function doPass(pi){if(MPG.on&&pi===0)mpSend({t:"act",k:"pass",seat:MPG.seat});
  passes++;sfx("pass");msg=`${names[pi]} lewat.`;
  if(passes>=P)return finish(-1,true);
  cur=(cur+1)%P;next();
}
function next(){
  render();if(over)return;const my=rid;
  if(cur===0){
    if(!hands[0].some(t=>sides(t).length)){busy=true;render();say(msg+" Kamu tidak punya kartu yang cocok, lewat.","you");setTimeout(()=>{if(my===rid)doPass(0)},1500)}
    else{busy=false;render();say(msg+" Giliranmu.","you")}
  }else{busy=true;say(`${msg} Giliran ${names[cur]}...`,"foe");if(!MPG.on)setTimeout(()=>{if(my===rid)aiStep()},1000)}
}
function aiStep(){
  const pi=cur,h=hands[pi];let best=null,bs=-1e9;
  h.forEach((t,i)=>sides(t).forEach(s=>{
    let nl,nr;
    if(!chain.length){nl=t.x;nr=t.y}
    else if(s==="L"){nl=t.y===L()?t.x:t.y;nr=R()}
    else{nr=t.x===R()?t.y:t.x;nl=L()}
    const rest=h.filter((_,k)=>k!==i);
    const sc=sum(t)*1.5+(t.x===t.y?2:0)+rest.filter(u=>u.x===nl||u.y===nl||u.x===nr||u.y===nr).length*2+Math.random();
    if(sc>bs){bs=sc;best=[i,s]}
  }));
  if(!best)return doPass(pi);
  place(pi,best[0],best[1]);
}
function finish(pi,blocked){
  over=true;busy=true;render();let w=pi,note="";
  if(blocked){
    const tot=hands.map(h=>h.reduce((a,t)=>a+sum(t),0)),mn=Math.min(...tot),ws=tot.map((v,i)=>v===mn?i:-1).filter(i=>i>=0);
    w=ws.length===1?ws[0]:-1;note=`Semua pemain lewat (kartu terkunci). Sisa titik: ${names.map((nm,i)=>nm+" "+tot[i]).join(", ")}.`;
  }
  const win=w===0,draw=w===-1;
  const T=draw?"Seri!":win?"Kamu menang!":names[w]+" menang";
  const S=note||(win?"Kartumu habis duluan.":`${names[w]} menghabiskan kartunya.`);
  say(S,win||draw?"you":"foe");
  setTimeout(()=>{sfx(draw?"draw":win?"win":"lose");$("#ovT").textContent=T;$("#ovS").textContent=S;$("#ov").classList.add("on")},800);
}
$("#hand").onclick=e=>{
  const b=e.target.closest(".dm");if(!b||cur!==0||busy||over)return;
  const i=+b.dataset.i,t=hands[0][i],s=sides(t);
  if(!s.length){toast(chain.length?"Kartu ini tidak cocok dengan ujung meja":"Mulai dengan balak "+must.x+"-"+must.y);return}
  if(s.length===2&&L()!==R()){pendI=i;$("#sideL").textContent=`Kiri (${L()})`;$("#sideR").textContent=`Kanan (${R()})`;$("#side").classList.add("on");return}
  place(0,i,s[s.length-1]);
};
$("#side").onclick=e=>{
  const b=e.target.closest("button");if(!b||pendI===null)return;
  const i=pendI;pendI=null;$("#side").classList.remove("on");place(0,i,b.id==="sideL"?"L":"R");
};
$("#seg").onclick=e=>{const b=e.target.closest(".btn");if(!b)return;n=+b.dataset.n;document.querySelectorAll("#seg .btn").forEach(x=>x.classList.toggle("on",x===b));newGame()};
$("#ovB").onclick=()=>{if(MPG.on){mpAgain();return}newGame()};
/* ---------- Mabar online (2 sampai 4 pemain) ---------- */
const mulberry=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const MP={room:null,host:false,started:false,joined:false,code:"",cid:Math.random().toString(36).slice(2,9),roster:[],order:[],onMsg:null,peerEv:null};
const info=h=>{$("#mpinfo").innerHTML=h};
const cleanN=n=>String(n||"").replace(/[^A-Za-z0-9 ]/g,"").trim().slice(0,12)||"Pemain";
const genCode=()=>Array.from({length:5},()=>"abcdefghjkmnpqrstuvwxyz23456789"[Math.floor(Math.random()*31)]).join("");
async function mpOpen(code){
  const room=typeof claude==="undefined"?null:await Promise.race([claude.use("room"),new Promise(r=>setTimeout(()=>r(null),8000))]);
  if(!room)throw 0;
  MP.room=await room.join("gpl-"+code);
  MP.room.on("g",m=>{const d=m.data;if(!d||d.cid===MP.cid)return;if(MP.onMsg)MP.onMsg(d)});
  if(MP.room.onPeer)MP.room.onPeer(ev=>{if(MP.peerEv)MP.peerEv(ev)});
}
const mpSend=d=>{if(MP.room)MP.room.emit("g",{...d,cid:MP.cid}).catch(()=>{})};
function mpOff(){if(MP.room)MP.room.leave().catch(()=>{});MP.room=null;MP.host=false;MP.started=false;MP.joined=false;MP.roster=[];MP.order=[]}
const fail=()=>info("Tidak bisa terhubung ke server mabar. Muat ulang halaman, lalu coba lagi.");
function showLobby(){
  info(`Kode room: <b>${MP.code.toUpperCase()}</b><br>Pemain (${MP.roster.length}/4): ${MP.roster.map(p=>p.name).join(", ")}<br>`+(MP.host?(MP.roster.length>=2?"Tekan Mulai main kalau semua sudah masuk.":"Kirim kode ini ke teman, lalu tunggu mereka gabung."):"Menunggu host memulai game..."));
  $("#mpstart").hidden=!(MP.host&&MP.roster.length>=2);
}
$("#mkroom").onclick=async()=>{
  mpOff();MP.host=true;info("Menghubungkan...");const code=genCode();
  try{await mpOpen(code)}catch(e){MP.host=false;return fail()}
  MP.code=code;MP.roster=[{cid:MP.cid,pid:MP.room.pid,name:cleanN(ME)}];showLobby();
};
$("#joinroom").onclick=async()=>{
  const code=$("#code").value.trim().toLowerCase();if(code.length<4)return info("Masukkan kode room dulu.");
  mpOff();info("Menghubungkan...");
  try{await mpOpen(code)}catch(e){return fail()}
  MP.code=code;let n=0;const hi=()=>mpSend({t:"hi",name:cleanN(ME),pid:MP.room.pid});
  const t=setInterval(()=>{if(MP.joined||!MP.room||++n>12){clearInterval(t);if(!MP.joined&&MP.room)info("Room tidak ketemu atau host belum siap. Cek kodenya, lalu coba lagi.")}else hi()},1500);hi();
};
$("#mpstart").onclick=()=>{
  if(!MP.host||MP.started||MP.roster.length<2)return;
  MP.started=true;MP.order=MP.roster.map(p=>p.cid);const seed=(Math.random()*2147483647)|0;
  mpSend({t:"start",order:MP.order,seed,first:0});mpBegin(seed,0);
};
function mpBegin(seed,first){
  MPG.on=true;MPG.P=MP.order.length;MPG.seat=MP.order.indexOf(MP.cid);MPG.first=first;
  MPG.names=MP.order.map(c=>(MP.roster.find(p=>p.cid===c)||{name:"Pemain"}).name);
  RNG=mulberry(seed);mode="mp";
  $("#mpc").hidden=true;$("#mpstart").hidden=true;
  info(`Tersambung! ${MPG.P} pemain: ${MPG.names.join(", ")}. Untuk keluar, pilih Lawan komputer.`);
  setCols();showGame(true);newGame();
}
function hostRestart(){const first=(MPG.first+1)%MPG.P,seed=(Math.random()*2147483647)|0;mpSend({t:"again",seed,first});mpBegin(seed,first)}
function mpAgain(){
  if(!over)return;
  if(MP.roster.some(p=>p.gone)){setMode("cpu");return}
  if(MP.host)hostRestart();else{mpSend({t:"want"});gmNotice("Menunggu host memulai ronde baru...")}
}
function mpAbort(T,S){over=true;busy=true;mpRefresh();say(S,"you");$("#ovT").textContent=T;$("#ovS").textContent=S;$("#ov").classList.add("on")}
MP.onMsg=d=>{
  if(d.t==="hi"&&MP.host){
    if(MP.started){mpSend({t:"full",to:d.cid});return}
    let p=MP.roster.find(x=>x.cid===d.cid);
    if(!p){
      if(MP.roster.length>=4){mpSend({t:"full",to:d.cid});return}
      let nm=cleanN(d.name),k=2;while(MP.roster.some(x=>x.name===nm))nm=cleanN(d.name)+" "+k++;
      MP.roster.push({cid:d.cid,pid:d.pid,name:nm});
    }
    mpSend({t:"roster",list:MP.roster});showLobby();return;
  }
  if(d.t==="roster"&&!MP.host){
    MP.roster=(d.list||[]).map(p=>({cid:p.cid,pid:p.pid,name:cleanN(p.name)}));
    if(MP.roster.some(p=>p.cid===MP.cid)){MP.joined=true;showLobby()}return;
  }
  if(d.t==="full"){if(d.to===MP.cid)info("Room ini sudah penuh atau game sudah dimulai.");return}
  if(d.t==="start"&&!MP.host&&!MP.started){if(!Array.isArray(d.order)||!d.order.includes(MP.cid))return;MP.started=true;MP.order=d.order;mpBegin(d.seed,d.first||0);return}
  if(d.t==="again"&&!MP.host&&MP.started&&over){mpBegin(d.seed,d.first);return}
  if(d.t==="want"&&MP.host&&MP.started&&over){hostRestart();return}
  if(!MP.started)return;
  if(d.t==="act")remoteAct(d);
};
MP.peerEv=ev=>{
  const p=MP.roster.find(x=>x.pid===ev.id);
  if(!MP.started){
    if(ev.state==="left"&&p){
      if(!MP.host&&p.cid===MP.roster[0].cid){info("Host keluar dari room. Buat atau gabung room lain.");MP.joined=false;MP.roster=[];return}
      MP.roster=MP.roster.filter(x=>x!==p);if(MP.host){mpSend({t:"roster",list:MP.roster});showLobby()}
    }
    return;
  }
  const nm=p?p.name:"Temanmu";
  if(ev.state==="offline")gmNotice(nm+" terputus. Menunggu dia kembali...");
  else if(ev.state==="online")gmNotice(nm+" tersambung lagi.");
  else if(ev.state==="left"&&p&&!p.gone){
    p.gone=true;gmNotice(nm+" keluar dari game.");
    if(!over){const sisa=MP.order.filter(c=>{const q=MP.roster.find(x=>x.cid===c);return q&&!q.gone&&c!==MP.cid}).length;
      mpAbort(sisa===0?"Kamu menang!":"Permainan dibatalkan",nm+" keluar dari permainan.")}
  }
};
function setMode(m){
  if(m===mode)return;
  if(mode==="mp"&&MP.started&&!over&&window.gmResult)window.gmResult("lose");
  mode=m;mpOff();MPG.on=false;RNG=Math.random;setCols();
  document.querySelectorAll("#md .btn").forEach(n=>n.classList.toggle("on",n.dataset.m===m));
  $("#mp").hidden=m!=="mp";$("#seg").hidden=m==="mp";$("#mpc").hidden=false;$("#mpstart").hidden=true;info("");
  if(m==="mp"){showGame(false);if($("#ov"))$("#ov").classList.remove("on")}else{showGame(true);newGame()}
}
$("#md").onclick=e=>{const t=e.target.closest(".btn");if(t)setMode(t.dataset.m)};
function showGame(v){GAMEEL.forEach(s=>document.querySelectorAll(s).forEach(e=>{e.hidden=!v}));if(typeof afterShow==="function")afterShow()}
const GAMEEL=["#opps",".mejaw","#hand","#st",".emo"];
const mpRefresh=()=>render();const setCols=()=>{};
function remoteAct(d){
  const li=(d.seat-MPG.seat+P)%P;if(over||li===0||li!==cur)return;
  if(d.k==="place"){const i=hands[li].findIndex(t=>(t.x===d.x&&t.y===d.y)||(t.x===d.y&&t.y===d.x));if(i>=0)place(li,i,d.side)}
  else if(d.k==="pass")doPass(li);
}

newGame();

(()=>{

  const botSay=()=>fly(E[Math.floor(Math.random()*E.length)],botName(),false);

  if(typeof MP!=="undefined"&&MP&&MP.onMsg){const o=MP.onMsg;MP.onMsg=d=>{if(d.t==="emo"){const q=MP.roster&&MP.roster.find(x=>x.cid===d.cid);if(q)fly(d.e,q.name,false);return}o(d)}}
  new MutationObserver(()=>{const f=st.classList.contains("foe");if(f&&!was&&!inMp()&&Date.now()-lastSp>8000&&Math.random()<.12){lastSp=Date.now();setTimeout(botSay,700+Math.random()*900)}was=f}).observe(st,{attributes:true,attributeFilter:["class"]});
})();
/* ---------- HUD: cara main dan win streak ---------- */
(()=>{
  const gm=document.title.replace("GasMain: ","");

    "Battleship":["Tiap pemain punya 5 kapal (panjang 5, 4, 3, 3, 2) di papan 10×10.","Taruh kapalmu: pilih kapal, tekan Putar untuk mengatur arah, lalu ketuk kotak. Ketuk kapal di papan untuk memindahkannya, atau tekan Acak.","Bergantian menembak satu kotak. Tanda ✕ berarti kena, titik berarti meleset.","Kapal yang semua kotaknya kena akan tenggelam dan dicoret.","Pemenang adalah yang lebih dulu menenggelamkan semua kapal lawan."],

    "Uno":["Tiap pemain dapat 7 kartu. Habiskan kartumu duluan.","Mainkan kartu yang warna atau angka/simbolnya sama dengan kartu di tengah. Kartu yang bisa dimainkan terangkat dan menyala.","Lewati: pemain berikutnya hilang giliran. Balik arah: arah main berbalik (dengan 2 pemain sama seperti Lewati). +2: lawan ambil 2 kartu dan hilang giliran.","Wild: pilih warna baru. Wild +4: pilih warna dan lawan ambil 4 kartu; hanya boleh kalau kamu tidak punya warna yang sama.","Tidak ada kartu yang cocok? Ketuk tumpukan untuk ambil satu kartu. Kalau bisa dimainkan, boleh langsung dimainkan.","Kartumu tinggal satu? Tekan UNO! sebelum komputer jalan, kalau lupa kamu ambil 2 kartu."],
    "Ular Tangga":["Lempar dadu dan bidakmu maju sebanyak angka dadu. Tiap giliran hanya satu lemparan.","Berhenti di kaki tangga: naik ke ujung atasnya. Berhenti di kepala ular: turun ke ekornya.","Peta ular dan tangga diacak tiap ronde.","Harus sampai tepat di kotak 100. Kalau angka dadu kelebihan, bidak tidak jalan.","Pemenang adalah yang pertama sampai di kotak 100."],
    "Ludo":["Tiap pemain punya 4 bidak. Kamu bidak merah.","Lempar dadu. Angka 6 dibutuhkan untuk mengeluarkan bidak dari kandang.","Bidak berputar searah jarum jam lewat jalur putih, lalu masuk jalur warna menuju rumah di tengah. Angkanya harus pas untuk masuk rumah.","Mendarat di bidak lawan pada kotak biasa memakannya (kembali ke kandang). Kotak berbintang dan kotak start aman.","Dapat angka 6, memakan bidak, atau sampai rumah berarti main lagi.","Pemenang adalah yang pertama membawa 4 bidaknya ke rumah."],
    "Gaple":["Tiap pemain dapat 7 kartu domino (set 0 sampai 6).","Pemilik balak (kartu kembar) tertinggi jalan duluan dengan balak itu.","Sambung kartu di ujung kiri atau kanan meja yang angkanya sama. Ujung yang bisa dipakai menyala biru. Kartu kembar dipasang menyilang.","Tidak ada kartu yang cocok? Giliran lewat (tidak ambil kartu).","Menang kalau kartumu habis. Kalau semua pemain lewat berturut-turut (terkunci), pemenangnya yang sisa titiknya paling sedikit."],
    "Othello":["Papan 8×8. Kamu cyan dan jalan duluan.","Taruh cakram di titik terang, yaitu kotak yang mengapit satu atau lebih cakram lawan di antara cakrammu.","Semua cakram lawan yang terapit otomatis berbalik jadi warnamu.","Tidak punya langkah? Giliran dilewati.","Permainan selesai saat papan penuh atau tidak ada yang bisa jalan. Cakram terbanyak menang."]
  };
  const css=document.createElement("style");
  css.textContent=".hud{display:flex;align-items:center;justify-content:space-between;margin:-2px 0 12px;min-height:40px}.hbtn{font:inherit;font-weight:700;font-size:13px;border:0;border-radius:99px;padding:8px 14px;background:#22164f;color:#f1edff;cursor:pointer}.stk{display:flex;align-items:center;gap:4px;font-weight:800;font-size:20px;background:#22164f;border-radius:99px;padding:3px 14px 3px 10px;border:2px solid #ff7a1855}.stk .fire{display:inline-block;font-size:22px;filter:drop-shadow(0 0 6px #ff7a18);animation:fire .8s ease-in-out infinite alternate;transform-origin:50% 90%}@keyframes fire{0%{transform:scale(.95) rotate(-7deg)}50%{transform:scale(1.15) rotate(4deg)}100%{transform:scale(1.02) rotate(7deg)}}.stk.t2{border-color:#ff7a18}.stk.t2 .fire{font-size:26px}.stk.t3{border-color:#ffd84d;box-shadow:0 0 14px #ff7a1888}.stk.t3 .fire{font-size:30px;filter:drop-shadow(0 0 10px #ffb02e)}.stk.pop{animation:sp .5s}@keyframes sp{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}.hov{position:fixed;inset:0;background:#0b0620ee;display:none;place-items:center;padding:20px;z-index:40}.hov.on{display:grid}.hc{background:#22164f;border-radius:24px;padding:22px;max-width:380px;width:100%;max-height:86vh;overflow:auto;color:#f1edff}.hc h2{margin:0 0 12px;font-size:26px;letter-spacing:-.5px}.hc ol{margin:0 0 16px;padding-left:20px;line-height:1.5}.hc li{margin-bottom:8px}.hc button{width:100%;font:inherit;font-weight:800;font-size:17px;border:0;border-radius:14px;padding:14px;background:#5ef2e0;color:#06241f;cursor:pointer}@media (prefers-reduced-motion:reduce){.stk .fire,.stk.pop{animation:none}}";
  document.head.appendChild(css);
  const top=document.querySelector(".top");if(!top)return;
  const hud=document.createElement("div");hud.className="hud";
  hud.innerHTML='<button type="button" class="hbtn" id="hbtn">\u2753 Cara main</button><div class="stk" id="stk" hidden><span class="fire">\u{1F525}</span><b id="stkn">0</b></div>';
  top.insertAdjacentElement("afterend",hud);
  const hov=document.createElement("div");hov.className="hov";
  hov.innerHTML=`<div class="hc"><h2>Cara main ${gm}</h2><ol>${(RULES[gm]||["Aturan belum tersedia."]).map(x=>`<li>${x}</li>`).join("")}</ol><button type="button">Mengerti</button></div>`;
  document.body.appendChild(hov);
  document.getElementById("hbtn").onclick=()=>hov.classList.add("on");
  hov.onclick=e=>{if(e.target===hov||e.target.tagName==="BUTTON")hov.classList.remove("on")};
  const KEY="gasmain_streak_"+gm.toLowerCase().replace(/[^a-z0-9]+/g,"-");
  let S={n:0,b:0};try{S=JSON.parse(localStorage.getItem(KEY))||S}catch(e){}
  const stk=document.getElementById("stk"),num=document.getElementById("stkn");
  const showS=pop=>{stk.hidden=S.n<1;num.textContent=S.n;stk.title="Win streak terbaik: "+S.b;stk.className="stk"+(S.n>=7?" t3":S.n>=3?" t2":"");if(pop){stk.classList.remove("pop");void stk.offsetWidth;stk.classList.add("pop")}};
  const res=r=>{if(r==="win"){S.n++;S.b=Math.max(S.b,S.n)}else if(r==="lose")S.n=0;else return;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}showS(true)};
  window.gmResult=res;showS(false);
  /* --- pengaturan (gir) dan pemberitahuan --- */
  const css2=document.createElement("style");
  css2.textContent='#sfx.gear,.btn.gear{font-size:18px;line-height:1;padding:6px 12px}.gset{position:fixed;inset:0;background:#0b0620ee;display:none;place-items:center;padding:20px;z-index:45}.gset.on{display:grid}.gcard{background:#22164f;border-radius:24px;padding:22px;max-width:360px;width:100%;color:#f1edff}.gcard h2{margin:0 0 10px;font-size:24px;letter-spacing:-.5px}.grow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid #ffffff14}.grow small{display:block;color:#9a8fd0;font-size:12px;margin-top:2px}.sw{flex:none;width:52px;height:30px;border-radius:99px;border:0;background:#3a2f6e;position:relative;cursor:pointer;transition:background .2s}.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}.sw.on{background:#5ef2e0}.sw.on::after{left:25px}.gcard .done{width:100%;margin-top:14px;font:inherit;font-weight:800;font-size:17px;border:0;border-radius:14px;padding:14px;background:#5ef2e0;color:#06241f;cursor:pointer}.gnote{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translate(-50%,-30px);background:#f1edff;color:#1a1040;font-weight:800;padding:11px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:.3s;z-index:60;max-width:92vw;text-align:center}.gnote.on{opacity:1;transform:translate(-50%,0)}@media (prefers-reduced-motion:reduce){.sw,.sw::after,.gnote{transition:none}}';
  document.head.appendChild(css2);
  let gnT;const gn=document.createElement("div");gn.className="gnote";document.body.appendChild(gn);
  window.gmNotice=t=>{gn.textContent=t;gn.classList.add("on");clearTimeout(gnT);gnT=setTimeout(()=>gn.classList.remove("on"),4500)};
  const kv=(k,v)=>{try{localStorage.setItem(k,v?"1":"0")}catch(e){}};
  const kl=(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:v!=="0"}catch(e){return d}};
  const hasMus=typeof mOn!=="undefined";
  sOn=kl("gasmain_efek",true);
  if(hasMus)mOn=kl("gasmain_musik",true);
  let emoOn=kl("gasmain_emoji",true);
  const emoEl=document.querySelector(".emo"),applyEmo=()=>{if(emoEl)emoEl.style.display=emoOn?"":"none"};applyEmo();
  const rows=[{k:"efek",t:"Efek suara",s:"Bunyi saat main, menang, dan kalah",get:()=>sOn,set:v=>{sOn=v;kv("gasmain_efek",v)}}];
  if(hasMus)rows.push({k:"musik",t:"Musik",s:"Lagu latar saat bertempur",get:()=>mOn,set:v=>{mOn=v;kv("gasmain_musik",v);if(typeof AC!=="undefined"&&AC&&AC.mus&&typeof mus!=="undefined"&&mus)AC.mus.gain.setTargetAtTime(v?.5:0,AC.currentTime,.1)}});
  if(emoEl)rows.push({k:"emoji",t:"Tombol emoji",s:"Reaksi \u{1F5FF} \u{1F92B} \u{1F62D} \u2620\uFE0F \u{1F4A9} saat main",get:()=>emoOn,set:v=>{emoOn=v;kv("gasmain_emoji",v);applyEmo()}});
  const gs=document.createElement("div");gs.className="gset";document.body.appendChild(gs);
  const paint=()=>{gs.innerHTML='<div class="gcard"><h2>Pengaturan</h2>'+rows.map(r=>`<div class="grow"><div>${r.t}<small>${r.s}</small></div><button type="button" class="sw${r.get()?" on":""}" data-k="${r.k}" aria-label="${r.t}" aria-pressed="${r.get()}"></button></div>`).join("")+'<button type="button" class="done">Selesai</button></div>'};
  const flip=k=>{const r=rows.find(x=>x.k===k);if(r){r.set(!r.get());paint()}};
  gs.onclick=e=>{const b=e.target.closest("button");if(!b){if(e.target===gs)gs.classList.remove("on");return}if(b.classList.contains("done")){gs.classList.remove("on");return}flip(b.dataset.k)};
  window.gmSettings={toggle:flip};
  const gear=document.getElementById("sfx");
  if(gear){gear.innerHTML="&#9881;";gear.className="btn sm gear";gear.setAttribute("aria-label","Pengaturan");gear.onclick=()=>{paint();gs.classList.add("on")}}
  const mb=document.getElementById("mus");if(mb)mb.style.display="none";

  const ov=document.getElementById("ov"),ovT=document.getElementById("ovT");
  if(ov&&ovT){
    let was=false;
    new MutationObserver(()=>{
      const on=ov.classList.contains("on");
      if(on&&!was){
        const t=ovT.textContent.trim().toLowerCase();
        if(!/seri/.test(t)){
          if(/tenggelam|kalah/.test(t))res("lose");
          else if(/menang/.test(t))res(/^(kamu|menang)/.test(t)||t.startsWith(String(ME).toLowerCase())?"win":"lose");
        }
      }
      was=on;
    }).observe(ov,{attributes:true,attributeFilter:["class"]});
  }else{
    const scE=document.getElementById("sc");
    if(scE){
      const nums=()=>[...scE.querySelectorAll("b")].map(b=>+b.textContent);
      let prev=nums();
      new MutationObserver(()=>{
        const c=nums();
        if(c[0]===prev[0]+1&&c[1]===prev[1]&&c[2]===prev[2])res("win");
        else if(c[2]===prev[2]+1&&c[0]===prev[0]&&c[1]===prev[1])res("lose");
        prev=c;
      }).observe(scE,{childList:true,subtree:true});
    }
  }
})();
