<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Battleship: Lawan Komputer</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#150d2e;--panel:#22164f;--cell:#2c1d63;--ink:#f1edff;--mute:#9a8fd0;--cy:#5ef2e0;--pk:#ff4f8b;--ship:#c9bcff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:radial-gradient(800px 420px at 85% -8%,#4a2bb066,transparent),radial-gradient(600px 400px at -10% 105%,#ff4f8b22,transparent),var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh}
.wrap{max-width:460px;margin:0 auto;padding:16px 14px 44px}
h1{font-size:38px;font-weight:800;letter-spacing:-1.5px;margin:6px 0 0;line-height:1}
.sub{color:var(--mute);margin:6px 0 14px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.tg{display:flex;flex-direction:column;align-items:flex-end;gap:6px;margin-top:6px}
.tg .btn{padding:7px 12px;font-size:12px;border-radius:99px}
.tg .btn.off{opacity:.5}
.status{padding:12px 14px;border-radius:14px;background:var(--panel);font-weight:700;margin:10px 0;min-height:48px;line-height:1.35}
.status.you{box-shadow:inset 0 0 0 2px var(--cy)}
.status.foe{box-shadow:inset 0 0 0 2px var(--pk)}
.h3{font-weight:700;margin:16px 0 8px;color:var(--mute);font-size:14px}
.board{display:grid;grid-template-columns:repeat(11,1fr);gap:3px;width:100%;margin:0 auto}
.board.sm{width:66%}
.lbl{display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--mute);font-weight:700}
.c{aspect-ratio:1;border-radius:6px;background:var(--cell);position:relative;cursor:pointer;border:0;padding:0;min-width:0}
.c.ship{background:var(--ship)}
.c.pv{background:#5ef2e0aa}
.c.bad{background:#ff4f8b88}
.c.miss::after{content:"";position:absolute;inset:36%;border-radius:50%;background:var(--mute)}
.c.hit{background:var(--pk)}
.c.hit::after{content:"\2715";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:800;font-size:clamp(10px,3.4vw,16px)}
.c.sunk{background:#8d1b4b}
.c.st::before{content:"";position:absolute;background:#fff;z-index:2;box-shadow:0 0 0 1px #5a0f30}
.c.lh::before{left:-2px;right:-2px;top:calc(50% - 2px);height:4px}
.c.lh.l0::before{left:12%;border-radius:4px 0 0 4px}
.c.lh.l1::before{right:12%;border-radius:0 4px 4px 0}
.c.lv::before{top:-2px;bottom:-2px;left:calc(50% - 2px);width:4px}
.c.lv.l0::before{top:12%;border-radius:4px 4px 0 0}
.c.lv.l1::before{bottom:12%;border-radius:0 0 4px 4px}
.c.last{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
#enemy .c:not(.hit):not(.miss):hover{outline:2px solid var(--cy)}
.btn{font:inherit;font-weight:700;border:0;border-radius:14px;padding:12px 14px;background:var(--panel);color:var(--ink);cursor:pointer}
.btn.main{background:var(--cy);color:#06241f;width:100%;font-size:17px;padding:15px;margin-top:6px}
.btn:disabled{opacity:.35;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row .btn{flex:1}
.tray{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.sp{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:var(--panel);border:2px solid transparent;color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
.sp.sel{border-color:var(--cy)}
.sp.done{opacity:.45}
.sp i{display:flex;gap:2px}
.sp i b{width:9px;height:9px;border-radius:2px;background:var(--ship)}
.fleet{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{font-size:12px;padding:4px 9px;border-radius:99px;background:var(--panel);color:var(--mute)}
.chip.dead{background:var(--pk);color:#fff;text-decoration:line-through}
.ov{position:fixed;inset:0;background:#0b0620ee;display:none;place-items:center;padding:20px;z-index:9}
.ov.on{display:grid}
.card{background:var(--panel);border-radius:24px;padding:26px;text-align:center;max-width:340px}
.card h2{font-size:36px;margin:0 0 8px;letter-spacing:-1px;line-height:1.05}
.card p{color:var(--mute);margin:0 0 18px}
@media (prefers-reduced-motion:reduce){.c.last{animation:none}}
.seg{display:flex;gap:6px}
.seg .btn{flex:1;padding:10px 6px;font-size:14px}
.seg .btn.on{background:var(--cy);color:#06241f}
[hidden]{display:none!important}
#md{margin-bottom:10px}
.mpbox{background:var(--panel);border-radius:16px;padding:12px;margin:10px 0 14px}
#mpc{display:flex;flex-direction:column;gap:8px}
#mpc:not([hidden])+.mpinfo:not(:empty){margin-top:10px}
.r{display:flex;gap:8px}
.r input{font:inherit;font-weight:700;flex:1;min-width:0;background:var(--bg);color:var(--ink);border:2px solid #ffffff22;border-radius:12px;padding:10px 12px;letter-spacing:3px;text-transform:lowercase}
.mpinfo{color:var(--mute);line-height:1.45;font-size:14px}
.mpinfo b{color:var(--cy);font-size:24px;letter-spacing:4px}
</style>
<script src="/mp.js"></script>
</head>
<body>
<div class="wrap">
  <div class="top"><div><a href="/" style="display:block;margin-bottom:6px;color:#9a8fd0;text-decoration:none;font-weight:700">&lsaquo; GasMain</a><h1>Battleship</h1>
  <p class="sub">Lawan komputer, papan 10×10</p></div><div class="tg"><button class="btn" id="mus"></button><button class="btn" id="sfx"></button></div></div>

  <div class="seg" id="md"><button class="btn on" data-m="cpu">Lawan komputer</button><button class="btn" data-m="mp">Mabar online</button></div>
  <div id="mp" hidden><div class="mpbox"><div id="mpc"><button class="btn" id="mkroom">Buat room</button><div class="r"><input id="code" placeholder="Kode dari teman" maxlength="5" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn" id="joinroom">Gabung</button></div></div><div class="mpinfo" id="mpinfo"></div></div></div>
  <section id="setup">
    <div class="status you" id="hint"></div>
    <div class="board" id="mine"></div>
    <div class="tray" id="tray"></div>
    <div class="row">
      <button class="btn" id="rot"></button>
      <button class="btn" id="rnd">Acak</button>
      <button class="btn" id="clr">Kosongkan</button>
    </div>
    <button class="btn main" id="go">Gas, mulai!</button>
  </section>

  <section id="play" hidden>
    <div class="status you" id="st"></div>
    <div class="h3">Lautan lawan</div>
    <div class="board" id="enemy"></div>
    <div class="fleet" id="fleet"></div>
    <div class="h3">Armadamu</div>
    <div class="board sm" id="mine2"></div>
    <div class="row"><button class="btn" id="again">Ulang dari awal</button></div>
  </section>
</div>

<div class="ov" id="ov"><div class="card">
  <h2 id="ovT"></h2><p id="ovS"></p>
  <button class="btn main" id="ovB">Main lagi</button>
</div></div>

<script>
const ME=(()=>{let n="";try{n=(localStorage.getItem("gasmain_nama")||decodeURIComponent(location.hash.slice(1)).replace(/_/g," ")).trim().slice(0,14)}catch(e){}
  if(n){const s=document.createElement("span");s.textContent=n;s.style.cssText="font-weight:800;color:#5ef2e0;background:#ffffff14;padding:5px 12px;border-radius:99px;font-size:13px;max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap";
    const top=document.querySelector(".top"),tg=top.querySelector(".tg");
    if(tg)tg.insertBefore(s,tg.firstChild);else top.insertBefore(s,top.querySelector(".btn"))}
  return n||"Kamu"})();
const N=10,L="ABCDEFGHIJ";
const SH=[["Kapal Induk",5],["Kapal Perang",4],["Kapal Penjelajah",3],["Kapal Selam",3],["Kapal Perusak",2]];
const $=s=>document.querySelector(s);
const mk=()=>({c:Array.from({length:100},()=>({s:-1,x:false})),ships:SH.map(([n,l])=>({n,l,cells:[],h:0})),last:-1});
let me,foe,phase,sel,horiz,turn,shots,hits,busy;
let mode="cpu",pend=null,myR=false,opR=false,rnd=0,resC={};

function cellsFor(i,len,h){const r=Math.floor(i/N),c=i%N;if(h?c+len>N:r+len>N)return null;return Array.from({length:len},(_,k)=>h?i+k:i+k*N)}
function fits(b,cs){return !!cs&&cs.every(i=>b.c[i].s<0)}
function put(b,k,cs){b.ships[k].cells=cs;cs.forEach(i=>b.c[i].s=k)}
function lift(b,k){b.ships[k].cells.forEach(i=>b.c[i].s=-1);b.ships[k].cells=[]}
function rand(b){b.ships.forEach((_,k)=>lift(b,k));b.ships.forEach((s,k)=>{let cs;do{cs=cellsFor(Math.floor(Math.random()*100),s.l,Math.random()<.5)}while(!fits(b,cs));put(b,k,cs)})}
const sunkOf=(b,x)=>x.s>=0&&b.ships[x.s].h>=b.ships[x.s].l;
const nm=i=>L[Math.floor(i/N)]+(i%N+1);
const dead=b=>b.ships.every(s=>s.h>=s.l);
const strike=(b,k,i)=>{const s=b.ships[k],j=s.cells.indexOf(i);return " st "+(s.cells[1]-s.cells[0]===1?"lh":"lv")+(j===0?" l0":"")+(j===s.l-1?" l1":"")};

function draw(el,b,showShips){
  let h='<div class="lbl"></div>'+[...Array(N)].map((_,i)=>`<div class="lbl">${i+1}</div>`).join('');
  for(let r=0;r<N;r++){h+=`<div class="lbl">${L[r]}</div>`;
    for(let c=0;c<N;c++){const i=r*N+c,x=b.c[i];let k="c";
      if(x.x)k+=x.s>=0?(sunkOf(b,x)?" hit sunk"+strike(b,x.s,i):" hit"):" miss";else if(showShips&&x.s>=0)k+=" ship";
      if(i===b.last)k+=" last";
      h+=`<button class="${k}" data-i="${i}" aria-label="${nm(i)}"></button>`}}
  el.innerHTML=h;
}

/* ---------- Suara dan musik (dibuat dengan kode, tanpa file) ---------- */
let AC=null,mOn=true,sOn=true,mus=null;
function ac(){
  if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
    AC=new C();const m=AC.createDynamicsCompressor();m.connect(AC.destination);
    AC.sfx=AC.createGain();AC.sfx.gain.value=.8;AC.sfx.connect(m);
    AC.mus=AC.createGain();AC.mus.gain.value=0;AC.mus.connect(m);
    AC.nb=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const a=AC.nb.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}
  if(AC.state==="suspended")AC.resume();
  return AC;
}
function tone(f,t,d,o={}){
  const{type="sine",v=.2,f2,atk=.005,lp,dst=AC.sfx}=o;
  const os=AC.createOscillator(),g=AC.createGain();os.type=type;os.frequency.setValueAtTime(f,t);
  if(f2)os.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+atk);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  let n=os;if(lp){const F=AC.createBiquadFilter();F.type="lowpass";F.frequency.value=lp;os.connect(F);n=F}
  n.connect(g);g.connect(dst);os.start(t);os.stop(t+d+.05);
}
function burst(t,d,v,f0,f1,ty="lowpass",dst){
  const s=AC.createBufferSource();s.buffer=AC.nb;
  const F=AC.createBiquadFilter();F.type=ty;F.frequency.setValueAtTime(f0,t);F.frequency.exponentialRampToValueAtTime(f1,t+d);
  const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(F);F.connect(g);g.connect(dst||AC.sfx);s.start(t,Math.random());s.stop(t+d);
}
const SND={
  miss(){const t=AC.currentTime;burst(t,.3,.22,2400,500,"bandpass")},
  hit(){const t=AC.currentTime;burst(t,.4,.8,2800,200);tone(150,t,.4,{f2:40,v:.9})},
  sunk(){const t=AC.currentTime;SND.hit();burst(t+.25,1.2,.9,2000,90);tone(95,t+.25,1.1,{f2:28,v:1});
    [[600,300],[460,210],[320,120]].forEach(([a,b],k)=>tone(a,t+.6+k*.22,.18,{f2:b,v:.18}))},
  win(){const t=AC.currentTime,n=[523.25,659.25,783.99,1046.5];
    n.forEach((f,k)=>tone(f,t+k*.14,.5,{type:"triangle",v:.3}));n.forEach(f=>tone(f,t+.6,1.4,{type:"triangle",v:.2}))},
  lose(){const t=AC.currentTime;[440,349.23,293.66,220].forEach((f,k)=>tone(f,t+k*.4,.7,{type:"sawtooth",v:.22,lp:900}));tone(110,t+1.6,1.4,{f2:55,v:.5})}
};
const play=n=>{if(sOn&&ac())SND[n]()};
function musicStart(){
  if(!ac()||mus)return;
  const step=60/96/2,BASS=[55,0,55,55,0,55,58.27,0,55,0,55,55,0,65.41,61.74,0];
  let i=0,next=AC.currentTime+.15;
  AC.mus.gain.setTargetAtTime(mOn?.5:0,AC.currentTime,.3);
  const sched=()=>{
    while(next<AC.currentTime+.3){
      const s=i%16,d=AC.mus;
      if(BASS[s])tone(BASS[s],next,step*1.6,{type:"sawtooth",v:.22,lp:260,dst:d});
      if(s%8===0||s%8===2)tone(70,next,.25,{f2:38,v:.6,dst:d});
      burst(next,.04,.05,9000,9000,"highpass",d);
      if(s===0){const alt=Math.floor(i/16)%2?116.54:155.56;
        tone(110,next,step*16,{type:"sawtooth",v:.06,atk:1.5,lp:500,dst:d});
        tone(alt,next,step*16,{type:"sawtooth",v:.05,atk:1.5,lp:500,dst:d})}
      if(s===8)tone(1760,next,1.8,{v:.07,dst:d});
      next+=step;i++;
    }
  };
  mus=setInterval(sched,100);sched();
}
function musicStop(){
  if(mus){clearInterval(mus);mus=null}
  if(AC)AC.mus.gain.setTargetAtTime(0,AC.currentTime,.15);
}
function labels(){
  $("#mus").textContent="Musik "+(mOn?"nyala":"mati");$("#mus").classList.toggle("off",!mOn);
  $("#sfx").textContent="Efek "+(sOn?"nyala":"mati");$("#sfx").classList.toggle("off",!sOn);
}
$("#mus").onclick=()=>{mOn=!mOn;labels();if(AC&&mus)AC.mus.gain.setTargetAtTime(mOn?.5:0,AC.currentTime,.1)};
$("#sfx").onclick=()=>{sOn=!sOn;labels()};
document.addEventListener("visibilitychange",()=>{if(AC)document.hidden?AC.suspend():AC.resume()});
labels();

/* ---------- Tahap menaruh kapal ---------- */
const hint=t=>$("#hint").textContent=t;
function setupUI(keep){
  draw($("#mine"),me,true);
  $("#tray").innerHTML=me.ships.map((s,k)=>`<button class="sp ${k===sel?"sel":""} ${s.cells.length?"done":""}" data-k="${k}"><i>${"<b></b>".repeat(s.l)}</i>${s.n}</button>`).join("");
  const all=me.ships.every(s=>s.cells.length);
  $("#go").disabled=!all;
  $("#rot").textContent=horiz?"Arah: mendatar":"Arah: menurun";
  if(!keep)hint(all?"Armada siap. Ketuk kapal untuk memindahkan, atau mulai main.":`Taruh ${me.ships[sel].n} (${me.ships[sel].l} kotak). Ketuk kotak untuk menaruhnya.`);
}
$("#mine").onclick=e=>{
  const t=e.target.closest(".c");if(!t||phase!=="setup"||myR)return;
  const i=+t.dataset.i,x=me.c[i];
  if(x.s>=0){sel=x.s;lift(me,sel);setupUI(true);hint(`${me.ships[sel].n} diangkat. Ketuk kotak baru untuk menaruhnya.`);return}
  if(sel<0){hint("Semua kapal sudah di papan. Ketuk kapal untuk memindahkannya.");return}
  const old=me.ships[sel].cells.slice();lift(me,sel);
  const cs=cellsFor(i,me.ships[sel].l,horiz);
  if(fits(me,cs)){put(me,sel,cs);sel=me.ships.findIndex(s=>!s.cells.length);setupUI()}
  else{if(old.length)put(me,sel,old);setupUI(true);hint("Tidak muat di situ. Putar arah atau pilih kotak lain.")}
};
$("#mine").onmouseover=e=>{
  document.querySelectorAll("#mine .pv,#mine .bad").forEach(n=>n.classList.remove("pv","bad"));
  if(phase!=="setup"||sel<0)return;const t=e.target.closest(".c");if(!t)return;
  const cs=cellsFor(+t.dataset.i,me.ships[sel].l,horiz);if(!cs)return;
  const ok=cs.every(i=>me.c[i].s<0||me.c[i].s===sel);
  cs.forEach(i=>$(`#mine [data-i="${i}"]`).classList.add(ok?"pv":"bad"));
};
$("#tray").onclick=e=>{const b=e.target.closest(".sp");if(!b)return;sel=+b.dataset.k;setupUI()};
$("#rot").onclick=()=>{horiz=!horiz;setupUI(true)};
$("#rnd").onclick=()=>{rand(me);sel=-1;setupUI()};
$("#clr").onclick=()=>{me.ships.forEach((_,k)=>lift(me,k));sel=0;setupUI()};
$("#go").onclick=()=>{
  if(mode==="mp"&&MP.gone){setMode("cpu");return}
  if(mode==="mp"){ac();myR=true;mpSend({t:"rdy"});$("#go").disabled=true;hint("Menunggu temanmu siap...");tryStart();return}
  phase="play";foe=mk();rand(foe);turn="you";busy=false;ac();musicStart();
  $("#setup").hidden=true;$("#play").hidden=false;
  say("Giliranmu! Ketuk kotak di lautan lawan untuk menembak.","you");playUI();
};

/* ---------- Tahap bertempur ---------- */
const say=(t,c)=>{const s=$("#st");s.textContent=t;s.className="status "+c};
function playUI(){
  draw($("#enemy"),foe,false);draw($("#mine2"),me,true);
  $("#fleet").innerHTML=foe.ships.map(s=>`<span class="chip ${s.h>=s.l?"dead":""}">${s.n} ${s.l}</span>`).join("");
}
function shoot(b,i){
  const x=b.c[i];x.x=true;b.last=i;
  if(x.s<0)return{hit:false};
  const s=b.ships[x.s];s.h++;return{hit:true,sunk:s.h>=s.l?s:null};
}
$("#enemy").onclick=e=>{
  const t=e.target.closest(".c");if(!t||phase!=="play"||turn!=="you"||busy)return;
  const i=+t.dataset.i;if(foe.c[i].x)return;
  if(mode==="mp"){pend={i};busy=true;mpSend({t:"sh",i});say(`Menembak ${nm(i)}...`,"foe");return}
  shots++;const r=shoot(foe,i);if(r.hit)hits++;playUI();play(r.sunk?"sunk":r.hit?"hit":"miss");
  if(dead(foe))return end(true);
  const msg=r.sunk?`${nm(i)}: ${r.sunk.n} musuh tenggelam!`:r.hit?`${nm(i)}: kena!`:`${nm(i)}: meleset.`;
  say(msg+" Lawan lagi mikir...","foe");
  turn="foe";busy=true;setTimeout(aiTurn,1100);
};
function aiTurn(){
  const i=aiPick(),r=shoot(me,i);playUI();play(r.sunk?"sunk":r.hit?"hit":"miss");
  if(dead(me))return end(false);
  say(`Lawan menembak ${nm(i)}: `+(r.sunk?`${r.sunk.n} kamu tenggelam!`:r.hit?"kena kapalmu!":"meleset.")+" Giliranmu.","you");
  turn="you";busy=false;
}
function aiPick(){
  const b=me,open=i=>i>=0&&i<100&&!b.c[i].x;
  const live=[];b.c.forEach((x,i)=>{if(x.x&&x.s>=0&&b.ships[x.s].h<b.ships[x.s].l)live.push(i)});
  if(live.length){
    let best=[],bs=0;
    for(const h of live)for(const d of[1,-1,N,-N]){
      const n=h+d;
      if((d===1&&h%N===N-1)||(d===-1&&h%N===0)||!open(n))continue;
      const wrap=(d===1&&h%N===0)||(d===-1&&h%N===N-1);
      const sc=(!wrap&&live.includes(h-d))?3:1;
      if(sc>bs){bs=sc;best=[n]}else if(sc===bs)best.push(n);
    }
    if(best.length)return best[Math.floor(Math.random()*best.length)];
  }
  let pool=[];for(let i=0;i<100;i++)if(open(i)&&(Math.floor(i/N)+i%N)%2===0)pool.push(i);
  if(!pool.length)for(let i=0;i<100;i++)if(open(i))pool.push(i);
  return pool[Math.floor(Math.random()*pool.length)];
}
function end(win){
  phase="over";
  if(!win)draw($("#enemy"),foe,true);
  const a=shots?Math.round(hits/shots*100):0;
  $("#ovT").textContent=win?"Menang!":"Armadamu tenggelam";
  $("#ovS").textContent=(win?"Semua kapal lawan sudah kamu tenggelamkan.":"Lawan menang kali ini.")+` Tembakanmu ${shots}, akurasi ${a}%.`;
  musicStop();setTimeout(()=>{if(phase!=="over")return;play(win?"win":"lose");$("#ov").classList.add("on")},900);
}
function newGame(){
  me=mk();foe=null;phase="setup";myR=false;pend=null;sel=0;horiz=true;turn="you";shots=0;hits=0;busy=false;
  musicStop();$("#ov").classList.remove("on");$("#play").hidden=true;$("#setup").hidden=false;setupUI();
}
/* ---------- Mabar online ---------- */
const MP={room:null,host:false,peer:null,started:false,cid:Math.random().toString(36).slice(2,9),iv:0,onMsg:null,tick:null};
const info=h=>{$("#mpinfo").innerHTML=h};
const genCode=()=>Array.from({length:5},()=>"abcdefghjkmnpqrstuvwxyz23456789"[Math.floor(Math.random()*31)]).join("");
MP.peerEv=ev=>{
  if(!MP.started)return;
  if(ev.state==="offline")gmNotice("Temanmu terputus. Menunggu dia kembali...");
  else if(ev.state==="online")gmNotice("Temanmu tersambung lagi.");
  else if(ev.state==="left"){MP.gone=true;gmNotice("Temanmu keluar dari game.");if(MP.onMsg)MP.onMsg({t:"quit",cid:MP.peer})}
};
async function mpOpen(code){
  const room=typeof claude==="undefined"?null:await Promise.race([claude.use("room"),new Promise(r=>setTimeout(()=>r(null),8000))]);
  if(!room)throw 0;
  MP.room=await room.join("bs-"+code);
  MP.room.on("g",m=>{const d=m.data;if(!d||d.cid===MP.cid)return;if(MP.onMsg)MP.onMsg(d)});
  if(MP.room.onPeer)MP.room.onPeer(ev=>{if(MP.peerEv)MP.peerEv(ev)});
  MP.iv=setInterval(()=>{if(MP.tick)MP.tick()},2000);
}
const mpSend=d=>{if(MP.room)MP.room.emit("g",{...d,cid:MP.cid}).catch(()=>{})};
function mpOff(){clearInterval(MP.iv);if(MP.room)MP.room.leave().catch(()=>{});MP.room=null;MP.peer=null;MP.started=false;MP.host=false;MP.gone=false}
function hs(d,begin){
  if(d.t==="hi"){if(!MP.host)return true;if(MP.peer&&MP.peer!==d.cid){mpSend({t:"full",to:d.cid});return true}MP.peer=d.cid;mpSend({t:"start",to:d.cid});if(!MP.started){MP.started=true;begin()}return true}
  if(d.t==="start"){if(MP.host||d.to!==MP.cid)return true;MP.peer=d.cid;if(!MP.started){MP.started=true;begin()}return true}
  if(d.t==="full"){if(d.to===MP.cid)info("Room ini sudah penuh.");return true}
  return false;
}
const fail=()=>info("Tidak bisa terhubung ke server mabar. Muat ulang halaman, lalu coba lagi.");
$("#mkroom").onclick=async()=>{
  mpOff();MP.host=true;info("Menghubungkan...");const code=genCode();
  try{await mpOpen(code)}catch(e){MP.host=false;return fail()}
  info(`Kode room: <b>${code.toUpperCase()}</b><br>Kirim kode ini ke temanmu, lalu tunggu dia gabung.`);
};
$("#joinroom").onclick=async()=>{
  const code=$("#code").value.trim().toLowerCase();if(code.length<4)return info("Masukkan kode room dulu.");
  mpOff();info("Menghubungkan...");
  try{await mpOpen(code)}catch(e){return fail()}
  let n=0;const t=setInterval(()=>{if(MP.started||++n>12){clearInterval(t);if(!MP.started)info("Room tidak ketemu atau temanmu belum siap. Cek kodenya, lalu coba lagi.")}else mpSend({t:"hi"})},1500);
  mpSend({t:"hi"});
};
function beginMp(){$("#mpc").hidden=true;newGame();info("Tersambung! Taruh kapalmu, lalu tekan Siap.")}
function tryStart(){
  if(mode!=="mp"||!myR||!opR||phase!=="setup")return;
  myR=opR=false;phase="play";foe=mk();pend=null;resC={};
  const mine=MP.host===(rnd%2===0);rnd++;turn=mine?"you":"foe";busy=!mine;
  $("#setup").hidden=true;$("#play").hidden=false;musicStart();playUI();
  say(mine?"Kamu jalan duluan! Ketuk kotak di lautan lawan.":"Temanmu menembak duluan...",mine?"you":"foe");
}
MP.tick=()=>{if(pend)mpSend({t:"sh",i:pend.i});else if(myR&&phase==="setup")mpSend({t:"rdy"})};
MP.onMsg=d=>{
  if(hs(d,beginMp))return;if(d.cid!==MP.peer)return;
  if(d.t==="quit"){if(phase!=="over"){if(phase==="play"){end(true);$("#ovS").textContent="Temanmu keluar dari permainan."}else{hint("Temanmu keluar dari game.")}}return}
  if(d.t==="rdy"){opR=true;if(phase==="play")mpSend({t:"rdy"});tryStart();return}
  if(d.t==="sh"&&phase==="play"){
    const i=d.i;if(resC[i]){mpSend(resC[i]);return}
    if(me.c[i].x)return;
    const k=me.c[i].s,r=shoot(me,i);
    const res={t:"rs",i,hit:r.hit,k:r.hit?k:-1,cells:r.sunk?r.sunk.cells:null};
    resC[i]=res;mpSend(res);playUI();play(r.sunk?"sunk":r.hit?"hit":"miss");
    if(dead(me))return end(false);
    turn="you";busy=false;
    say(`Temanmu menembak ${nm(i)}: `+(r.sunk?`${r.sunk.n} kamu tenggelam!`:r.hit?"kena kapalmu!":"meleset.")+" Giliranmu.","you");
    return;
  }
  if(d.t==="rs"&&pend&&pend.i===d.i){
    const i=d.i,x=foe.c[i];pend=null;x.x=true;foe.last=i;shots++;
    if(d.hit){hits++;x.s=d.k;const s=foe.ships[d.k];if(d.cells)s.cells=d.cells;s.h++}
    const sk=d.hit&&foe.ships[d.k].h>=foe.ships[d.k].l;
    playUI();play(sk?"sunk":d.hit?"hit":"miss");
    if(dead(foe))return end(true);
    turn="foe";busy=true;
    say(`${nm(i)}: `+(sk?`${foe.ships[d.k].n} musuh tenggelam!`:d.hit?"kena!":"meleset.")+" Giliran temanmu...","foe");
  }
};
function setMode(m){
  mode=m;mpOff();myR=opR=false;pend=null;
  document.querySelectorAll("#md .btn").forEach(n=>n.classList.toggle("on",n.dataset.m===m));
  $("#mp").hidden=m!=="mp";$("#mpc").hidden=false;info("");
  $("#again").textContent=m==="mp"?"Keluar dari mabar":"Ulang dari awal";
  $("#go").textContent=m==="mp"?"Siap, mulai!":"Gas, mulai!";
  newGame();
  if(m==="mp"){$("#setup").hidden=true;info("Buat room atau gabung pakai kode dari temanmu.")}
}
$("#md").onclick=e=>{const t=e.target.closest(".btn");if(t)setMode(t.dataset.m)};
$("#ovB").onclick=()=>{if(mode==="mp"&&MP.gone){setMode("cpu");return}newGame()};
$("#again").onclick=()=>{
  if(phase==="play"){
    if(!confirm("Menyerah? Ini dihitung sebagai kalah."))return;
    if(mode==="mp")mpSend({t:"quit"});
    if(window.gmResult)window.gmResult("lose");
  }
  if(mode==="mp"){setMode("cpu");return}
  newGame();
};
newGame();
